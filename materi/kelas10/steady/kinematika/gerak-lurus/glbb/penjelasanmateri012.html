      border: 2px solid var(--ink);
      border-radius: 24px;

      right: 6%;

      text-transform: uppercase;
    }

    .height-line {
      position: absolute;
      top: 10%;
      bottom: 14%;
      left: 18%;
      border-left: 2px dashed rgba(16,36,59,.5);
    }

    .height-label {
      position: absolute;
      top: 15%;
      left: 7%;
      color: var(--muted);
      font-size: .7rem;
      font-weight: 700;
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      letter-spacing: .1em;

    .tower {

    .down-arrow {

      top: 7%;
      color: var(--orange);
      opacity: .75;
    }

    .ball {
      position: absolute;

      width: 44px;
      height: 44px;
      border: 2px solid var(--ink);

      box-shadow: 4px 5px 0 rgba(16,36,59,.22);
      will-change: transform;
    }

    .velocity-vector {
      position: absolute;
      left: 50%;
      bottom: 100%;
      width: 4px;
      height: 56px;
      border-radius: 999px;
      background: var(--orange);
      transform: translateX(-50%) scaleY(.35);
      transform-origin: 50% 100%;
      opacity: 1;
      transition: transform .12s ease, opacity .12s ease;
      z-index: 3;
    }

    .velocity-vector.is-zero {
      opacity: 0;
      visibility: hidden;
      transform: translateX(-50%) scaleY(0) !important;
      pointer-events: none;

    .up-ball.is-zero-velocity::after {

      top: -2.7rem;

      border: 2px solid var(--ink);
      border-radius: 999px;
      background: var(--yellow);
      color: var(--ink);
      padding: .32rem .62rem;
      font-size: .72rem;
      font-weight: 800;
      letter-spacing: .02em;
      box-shadow: 3px 3px 0 rgba(16,36,59,.18);
      z-index: 4;
    }

    .velocity-vector::after {
      content: "";
      position: absolute;
      left: 50%;
      top: -2px;
      width: 13px;
      height: 13px;
      border-left: 4px solid var(--orange);
      border-top: 4px solid var(--orange);
      transform: translateX(-50%) rotate(45deg);
    }

    .velocity-vector.is-downward {
      top: 100%;
      bottom: auto;
      transform-origin: 50% 0;
    }

    .velocity-vector.is-downward::after {
      top: auto;
      bottom: -2px;
      transform: translateX(-50%) rotate(225deg);
    }

    .up-ball { bottom: 19%; }
    .down-ball { top: 17%; }

    .formula-chip {

    .case-badge {

    }

    .case-badge.is-free-fall {

    }

    @keyframes rise-in {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 760px) {

        scroll-behavior: auto !important;
      }

       <div class="mb-7 flex flex-col gap-2 md:flex-row md:items-end md:justify-between">
        <div class="flex flex-wrap items-center gap-2">

          </div>

         <div class="grid grid-cols-3 gap-2"><button id="down-start" data-template-id="down-start-button" class="canva-button control-button inline-flex items-center justify-center gap-2 rounded-xl px-3 py-3 font-bold" type="button"><i data-lucide="play" aria-hidden="true" class="h-4 w-4"></i><span data-template-id="down-start-text" class="canva-text"></span></button> <button id="down-pause" data-template-id="down-pause-button" class="canva-button control-button inline-flex items-center justify-center gap-2 rounded-xl border-2 border-slate-800 px-3 py-3 font-bold" type="button"><i data-lucide="pause" aria-hidden="true" class="h-4 w-4"></i><span data-template-id="down-pause-text" class="canva-text"></span></button> <button id="down-reset" data-template-id="down-reset-button" class="canva-button control-button inline-flex items-center justify-center gap-2 rounded-xl px-3 py-3 font-bold" type="button"><i data-lucide="rotate-ccw" aria-hidden="true" class="h-4 w-4"></i><span data-template-id="down-reset-text" class="canva-text"></span></button>

  <script src="/_sdk/20ec72cea0cb85e1.editing_sdk.js" integrity="sha512-y1Lf0yXrnk1vqzLs9a/3x3pp+jSvei2Pbl+x/omYgN5b7HqLzMgs5Vx9HdgcQfw7jcDinPHCzHGQ6BsPf/68zQ=="></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      lucide.createIcons();

      const decimal = (value, digits = 2) => Number(value).toLocaleString("id-ID", {
        minimumFractionDigits: digits,
        maximumFractionDigits: digits
      });

      const views = {
        home: document.getElementById("home-view"),
        up: document.getElementById("up-view"),
        down: document.getElementById("down-view")
      };

      const navs = {
        home: document.getElementById("nav-home"),
        up: document.getElementById("nav-up"),
        down: document.getElementById("nav-down")
      };

      function showView(name) {
        Object.entries(views).forEach(([key, view]) => view.classList.toggle("is-active", key === name));
        Object.entries(navs).forEach(([key, button]) => {
          button.classList.toggle("is-active", key === name);
          button.setAttribute("aria-current", key === name ? "page" : "false");
        });
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      Object.entries(navs).forEach(([name, button]) => button.addEventListener("click", () => showView(name)));
      document.getElementById("hero-down-button").addEventListener("click", () => showView("down"));

      function createMotionSimulation(options) {
        const startButton = document.getElementById(options.startId);
        const pauseButton = document.getElementById(options.pauseId);
        const resetButton = document.getElementById(options.resetId);
        const status = document.getElementById(options.statusId);
        const ball = document.getElementById(options.ballId);
        const vector = ball.querySelector(".velocity-vector");
        const timeResult = document.getElementById(options.timeResultId);
        const positionResult = document.getElementById(options.positionResultId);
        const speedResult = document.getElementById(options.speedResultId);
        const controls = options.controlIds.map(id => document.getElementById(id));
        const outputs = options.outputIds.map(id => document.getElementById(id));

        let running = false;
        let animationFrame = null;
        let elapsedBeforePause = 0;
        let startedAt = 0;

        function setControlsDisabled(disabled) {
          controls.forEach(control => { control.disabled = disabled; });
        }

        function updateDisplay(time) {
          const state = options.calculate(time);
          timeResult.textContent = decimal(time) + " s";
          positionResult.textContent = decimal(state.position) + " m";
          speedResult.textContent = decimal(Math.abs(state.speed)) + " m/s";
          ball.style.transform = options.transform(state);
          const speedMagnitude = Math.abs(state.speed);
          vector.classList.toggle("is-downward", options.downward || state.speed < 0);
          // Sembunyikan vektor sebelum frame melewati titik saat kecepatan nol.
          const isZeroVelocity = speedMagnitude <= 0.35;
          vector.classList.toggle("is-zero", isZeroVelocity);
          ball.classList.toggle("is-zero-velocity", !options.downward && isZeroVelocity);
          vector.style.transform = "translateX(-50%) scaleY(" + (isZeroVelocity ? 0 : Math.min(.95, Math.max(.18, speedMagnitude / 20))) + ")";
        }

        function reset() {
          cancelAnimationFrame(animationFrame);
          animationFrame = null;
          running = false;
          elapsedBeforePause = 0;
          setControlsDisabled(false);
          startButton.disabled = false;
          options.updateOutputs(outputs);
          updateDisplay(0);
          options.onReset();
          status.textContent = options.readyText;
        }

        function finish() {
          cancelAnimationFrame(animationFrame);
          animationFrame = null;
          running = false;
          elapsedBeforePause = options.totalTime();
          updateDisplay(elapsedBeforePause);
          startButton.disabled = true;
          setControlsDisabled(false);
          status.textContent = options.finishedText;
        }

        function animate(now) {
          if (!running) return;
          const elapsed = elapsedBeforePause + (now - startedAt) / 1000;
          if (elapsed >= options.totalTime()) {
            finish();
            return;
          }
          updateDisplay(elapsed);
          animationFrame = requestAnimationFrame(animate);
        }

        startButton.addEventListener("click", () => {
          if (running) return;
          if (elapsedBeforePause >= options.totalTime()) reset();
          running = true;
          startedAt = performance.now();
          startButton.disabled = true;
          setControlsDisabled(true);
          status.textContent = elapsedBeforePause > 0 ? options.resumeText : options.runningText;
          animationFrame = requestAnimationFrame(animate);
        });

        pauseButton.addEventListener("click", () => {
          if (!running) return;
          elapsedBeforePause += (performance.now() - startedAt) / 1000;
          running = false;
          cancelAnimationFrame(animationFrame);
          animationFrame = null;
          updateDisplay(elapsedBeforePause);
          setControlsDisabled(false);
          startButton.disabled = false;
          status.textContent = options.pauseText;
        });

        resetButton.addEventListener("click", reset);

        controls.forEach(control => {
          control.addEventListener("input", () => {
            if (!running) reset();
          });
        });

        reset();
      }

      const upSpeed = document.getElementById("up-speed");
      const upGravity = document.getElementById("up-gravity");

      createMotionSimulation({
        startId: "up-start",
        pauseId: "up-pause",
        resetId: "up-reset",
        statusId: "up-status",
        ballId: "up-ball",
        timeResultId: "up-time-result",
        positionResultId: "up-height-result",
        speedResultId: "up-velocity-result",
        controlIds: ["up-speed", "up-gravity"],
        outputIds: ["up-speed-value", "up-gravity-value"],
        readyText: "Siap dilempar",
        runningText: "Bola bergerak ke atas",
        resumeText: "Simulasi dilanjutkan",
        pauseText: "Simulasi dijeda",
        finishedText: "Bola kembali ke posisi awal",
        downward: false,
        updateOutputs: outputs => {
          outputs[0].textContent = upSpeed.value + " m/s";
          outputs[1].textContent = decimal(upGravity.value, 1) + " m/s²";
        },
        totalTime: () => (2 * Number(upSpeed.value)) / Number(upGravity.value),
        calculate: time => {
          const speed = Number(upSpeed.value);
          const gravity = Number(upGravity.value);
          const maxHeight = (speed * speed) / (2 * gravity);
          const position = Math.max(0, speed * time - .5 * gravity * time * time);
          return { position, speed: speed - gravity * time, ratio: maxHeight === 0 ? 0 : position / maxHeight };
        },
        transform: state => "translateY(" + (-state.ratio * 240) + "px)",
        onReset: () => {}
      });

      const downHeight = document.getElementById("down-height");
      const downSpeed = document.getElementById("down-speed");
      const downGravity = document.getElementById("down-gravity");
      const freefallBadge = document.getElementById("freefall-badge");

      function updateCaseBadge() {
        const isFreeFall = Number(downSpeed.value) === 0;
        freefallBadge.classList.toggle("is-free-fall", isFreeFall);
        freefallBadge.textContent = isFreeFall ? "Kasus khusus: jatuh bebas" : "Mode lempar ke bawah";
      }

      createMotionSimulation({
        startId: "down-start",
        pauseId: "down-pause",
        resetId: "down-reset",
        statusId: "down-status",
        ballId: "down-ball",
        timeResultId: "down-time-result",
        positionResultId: "down-distance-result",
        speedResultId: "down-speed-result",
        controlIds: ["down-height", "down-speed", "down-gravity"],
        outputIds: ["down-height-value", "down-speed-value", "down-gravity-value"],
        readyText: "Siap dijalankan",
        runningText: "Bola bergerak ke bawah",
        resumeText: "Simulasi dilanjutkan",
        pauseText: "Simulasi dijeda",
        finishedText: "Bola telah mencapai tanah",
        downward: true,
        updateOutputs: outputs => {
          outputs[0].textContent = downHeight.value + " m";
          outputs[1].textContent = downSpeed.value + " m/s";
          outputs[2].textContent = decimal(downGravity.value, 1) + " m/s²";
        },
        totalTime: () => {
          const height = Number(downHeight.value);
          const speed = Number(downSpeed.value);
          const gravity = Number(downGravity.value);
          return (-speed + Math.sqrt(speed * speed + 2 * gravity * height)) / gravity;
        },
        calculate: time => {
          const height = Number(downHeight.value);
          const speed = Number(downSpeed.value);
          const gravity = Number(downGravity.value);
          const position = Math.min(height, speed * time + .5 * gravity * time * time);
          return { position, speed: speed + gravity * time, ratio: position / height };
        },
        transform: state => "translateY(" + (state.ratio * 225) + "px)",
        onReset: updateCaseBadge
      });
    });
  </script>
